import {WorldRenderer,characterMesh,block} from './js/render.js';const r=new WorldRenderer(document.querySelector('scene')||document.querySelector('canvas'));r.setWorld([block(0,-.1,0,30,.2,30,'#414b3a')]);let count=0;function frame(t){r.resize(1);r.half=3.5;r.begin(0,0);for(let i=0;i<4;i++)r.append(characterMesh('human',i===3?'swing':'idle',(t/1000)%.7,false,0,0,'bat'),(i-1.5)*2.8,0,0,i*Math.PI/2);r.draw();if(r.g.getError())throw Error('WebGL error');if(count++<120)requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
